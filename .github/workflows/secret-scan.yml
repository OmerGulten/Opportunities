name: Secret scan

# The repository is public: a committed credential is exposed the moment it is
# pushed. This runs in CI rather than only as a local hook because a hook can be
# skipped with --no-verify, and because it is the last gate before the commit
# becomes visible.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and then removed in a later commit is
          # still in the pack, and still readable by anyone who clones.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          # Findings are reported by rule and location; the matched value is
          # never printed, so the scan log does not leak what it just caught.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
